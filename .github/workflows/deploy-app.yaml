name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes
  push:
    branches:
      - test # Triggers on push to the 'test' branch
  workflow_dispatch: # Allows manual trigger if needed

jobs:
  commit_changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure Git
        run: |
          git config --global user.email "munawar.hossain@exos-systems.com"
          git config --global user.name "Fahim Munawar"

      - name: Set up GitHub token for authentication
        run: |
          git remote set-url origin https://github-actions:${{ secrets.STREAMLIT_TOKEN }}@github.com/FahimMunawar/AS.git

      - name: Make a dummy change
        run: |
          echo "Keeping the app alive - $(date)" >> keep_alive.txt
          git add keep_alive.txt

      - name: Commit and push changes
        run: |
          git commit -m "Keep Streamlit app alive - $(date)"
          git push

      - name: Clean up
        run: |
          rm keep_alive.txt
